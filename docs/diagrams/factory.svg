<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 390"><title id="title">From brief to verified change</title><desc id="desc">A trusted operator provides a brief, repository and stack. Forge clones an isolated workspace and creates a run branch. The selected coding provider implements the change. Forge executes real verification commands and retains their results. A verified local result includes a diff and artifacts. Remote publication is a separate explicit action.</desc><rect width="1120" height="390" rx="8" fill="#f3f1eb"/><text x="38" y="56" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#272820">One run follows one production line.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62645b"/></marker></defs><rect x="38" y="112" width="192" height="140" rx="8" fill="#ffffff" stroke="#bfb8ab"/><circle cx="65" cy="141" r="12" fill="#855414"/><text x="65" y="147" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">1</text><text x="58" y="190" font-family="Arial" font-size="23" fill="#272820">Brief</text><text x="58" y="223" font-family="Arial" font-size="16" fill="#62645b">Repository + stack</text><path d="M230 182h18" stroke="#62645b" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="112" width="192" height="140" rx="8" fill="#ffffff" stroke="#bfb8ab"/><circle cx="277" cy="141" r="12" fill="#855414"/><text x="277" y="147" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">2</text><text x="270" y="190" font-family="Arial" font-size="23" fill="#272820">Isolate</text><text x="270" y="223" font-family="Arial" font-size="16" fill="#62645b">Clone + run branch</text><path d="M442 182h18" stroke="#62645b" stroke-width="2" marker-end="url(#arrow)"/><rect x="462" y="112" width="192" height="140" rx="8" fill="#ffffff" stroke="#bfb8ab"/><circle cx="489" cy="141" r="12" fill="#855414"/><text x="489" y="147" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">3</text><text x="482" y="190" font-family="Arial" font-size="23" fill="#272820">Build</text><text x="482" y="223" font-family="Arial" font-size="16" fill="#62645b">Coding provider</text><path d="M654 182h18" stroke="#62645b" stroke-width="2" marker-end="url(#arrow)"/><rect x="674" y="112" width="192" height="140" rx="8" fill="#ffffff" stroke="#bfb8ab"/><circle cx="701" cy="141" r="12" fill="#855414"/><text x="701" y="147" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">4</text><text x="694" y="190" font-family="Arial" font-size="23" fill="#272820">Verify</text><text x="694" y="223" font-family="Arial" font-size="16" fill="#62645b">Actual commands</text><path d="M866 182h18" stroke="#62645b" stroke-width="2" marker-end="url(#arrow)"/><rect x="886" y="112" width="192" height="140" rx="8" fill="#ffffff" stroke="#bfb8ab"/><circle cx="913" cy="141" r="12" fill="#855414"/><text x="913" y="147" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">5</text><text x="906" y="190" font-family="Arial" font-size="23" fill="#272820">Deliver</text><text x="906" y="223" font-family="Arial" font-size="16" fill="#62645b">Diff + artifacts</text><rect x="38" y="289" width="1040" height="65" rx="6" fill="#eae7df"/><text x="58" y="315" font-family="Arial" font-size="17" font-weight="700" fill="#855414">Takeaway</text><text x="58" y="340" font-family="Arial" font-size="17" fill="#272820">Agent completion and passing verification are separate facts. Publication requires an explicit request.</text></svg>