<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 610"><title id="title">Forge single-node architecture</title><desc id="desc">Studio, CLI and SDK clients authenticate to a PyFly HTTP API. The API persists repository and run records in SQLite and dispatches a background run engine. The engine owns isolated Git clones, coding provider execution, verification processes and retained diff artifacts. Optional publication uses Git and provider-specific pull request APIs. All execution occurs with the server development identity. External provider logins and credentials remain in its environment.</desc><rect width="1120" height="610" rx="8" fill="#f3f1eb"/><text x="38" y="56" font-family="Arial" font-size="26" fill="#272820">One authenticated control plane. Local execution.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62645b"/></marker></defs><rect x="38" y="106" width="255" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="58" y="141" font-family="Arial" font-size="21" fill="#272820">Studio · CLI · SDK</text><text x="58" y="171" font-family="Arial" font-size="16" fill="#62645b">Trusted operator clients</text><rect x="377" y="106" width="335" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="397" y="141" font-family="Arial" font-size="21" fill="#272820">PyFly HTTP API</text><text x="397" y="171" font-family="Arial" font-size="16" fill="#62645b">Bearer token · /api/v1</text><rect x="792" y="106" width="287" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="812" y="141" font-family="Arial" font-size="21" fill="#272820">SQLite state</text><text x="812" y="171" font-family="Arial" font-size="16" fill="#62645b">Repositories · runs · events</text><rect x="377" y="251" width="335" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="397" y="286" font-family="Arial" font-size="21" fill="#272820">Background run engine</text><text x="397" y="316" font-family="Arial" font-size="16" fill="#62645b">Queue · cancellation · recovery</text><path d="M293 151h81M712 151h76M544 196v52" stroke="#62645b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="408" width="238" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="58" y="443" font-family="Arial" font-size="21" fill="#272820">Git workspace</text><text x="58" y="473" font-family="Arial" font-size="16" fill="#62645b">Isolated clone + branch</text><rect x="306" y="408" width="238" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="326" y="443" font-family="Arial" font-size="21" fill="#272820">Coding provider</text><text x="326" y="473" font-family="Arial" font-size="16" fill="#62645b">CLI · Agentic · bridge</text><rect x="574" y="408" width="238" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="594" y="443" font-family="Arial" font-size="21" fill="#272820">Verification</text><text x="594" y="473" font-family="Arial" font-size="16" fill="#62645b">Real command results</text><rect x="842" y="408" width="238" height="90" rx="7" fill="#ffffff" stroke="#bfb8ab"/><text x="862" y="443" font-family="Arial" font-size="21" fill="#272820">Diff + artifacts</text><text x="862" y="473" font-family="Arial" font-size="16" fill="#62645b">Local retained evidence</text><path d="M544 341v34H157v31M544 375H425v31M544 375H693v31M693 375H961v31" stroke="#62645b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="534" width="1040" height="42" rx="5" fill="#eae7df"/><text x="58" y="562" font-family="Arial" font-size="17" fill="#272820">Takeaway: server-side credentials and execution authority need a dedicated, trusted development environment.</text></svg>