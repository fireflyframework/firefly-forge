name: firefly-forge-local-identity
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${FORGE_KEYCLOAK_PORT:?Prepare local identity configuration}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Prepare local identity configuration}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Prepare local identity configuration}
      KC_HOSTNAME: ${FORGE_KEYCLOAK_ORIGIN:?Prepare local identity configuration}
      FORGE_LOCAL_CLIENT_SECRET: ${FORGE_LOCAL_CLIENT_SECRET:?Prepare local identity configuration}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ${FORGE_KEYCLOAK_CONFIG:?Prepare local identity configuration}/forge-realm.json:/opt/keycloak/data/import/forge-realm.json:ro
      - ./themes/forge:/opt/keycloak/themes/forge:ro
      - ../../studio/public/assets:/opt/keycloak/themes/forge/login/resources/img:ro
      - ../../studio/public/fonts:/opt/keycloak/themes/forge/login/resources/fonts:ro
    restart: "no"
volumes:
  keycloak-data:
