name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      FORGE_TEST_DATABASE_URL: postgresql+asyncpg://forge_test:forge_test@127.0.0.1:5432/forge_test
      FORGE_DATABASE_URL: postgresql+asyncpg://forge_test:forge_test@127.0.0.1:5432/forge_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_test
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_test -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: uv sync --locked --group dev --group docs
      - run: npm --prefix studio ci
      - run: npx --prefix studio playwright install --with-deps chromium
      - run: make check
      - run: npm --prefix studio audit --omit=dev --audit-level=high
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: firefly-forge-distributions
          path: dist/*
  container:
    runs-on: ubuntu-24.04
    env:
      FORGE_TEST_DATABASE_URL: postgresql+asyncpg://forge_test:forge_test@127.0.0.1:5432/forge_test
      FORGE_DATABASE_URL: postgresql+asyncpg://forge_test:forge_test@127.0.0.1:5432/forge_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_test
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_test -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build --tag firefly-forge:ci .
      - name: Exercise the non-root runtime image
        run: docker run --rm --network host -e FORGE_DATABASE_URL -e FORGE_DATABASE_SCHEMA=forge_container_ci -v "$PWD/scripts/container_smoke.py:/tmp/container_smoke.py:ro" --entrypoint /app/.venv/bin/python firefly-forge:ci /tmp/container_smoke.py
