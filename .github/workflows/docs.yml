name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm --prefix studio ci
      - run: npx --prefix studio playwright install --with-deps chromium
      - run: uv sync --locked --group docs
      - run: make docs-check
      - uses: actions/upload-artifact@v4
        with:
          name: firefly-forge-documentation-preview
          path: build/docs-site
          if-no-files-found: error
