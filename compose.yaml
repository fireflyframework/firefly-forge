services:
  forge:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      FORGE_AUTH_MODE: ${FORGE_AUTH_MODE:-oidc}
      FORGE_API_TOKEN: ${FORGE_API_TOKEN:-}
      FORGE_OIDC_ISSUER: ${FORGE_OIDC_ISSUER:-}
      FORGE_OIDC_CLIENT_ID: ${FORGE_OIDC_CLIENT_ID:-}
      FORGE_OIDC_CLIENT_SECRET: ${FORGE_OIDC_CLIENT_SECRET:-}
      FORGE_OIDC_API_AUDIENCE: ${FORGE_OIDC_API_AUDIENCE:-}
      FORGE_OIDC_REDIRECT_URI: ${FORGE_OIDC_REDIRECT_URI:-}
      FORGE_IDENTITY_ENCRYPTION_KEY: ${FORGE_IDENTITY_ENCRYPTION_KEY:-}
      FORGE_BROWSER_ORIGIN: ${FORGE_BROWSER_ORIGIN:-}
      FORGE_ALLOWED_HOSTS: ${FORGE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FORGE_KEYCLOAK_ADMIN_CLIENT_ID: ${FORGE_KEYCLOAK_ADMIN_CLIENT_ID:-}
      FORGE_KEYCLOAK_ADMIN_CLIENT_SECRET: ${FORGE_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      FORGE_DATA_DIR: /data
      FORGE_CONCURRENCY: ${FORGE_CONCURRENCY:-2}
      FORGE_DATABASE_URL: ${FORGE_DATABASE_URL:?Set the PostgreSQL connection URL}
      FORGE_DATABASE_SCHEMA: ${FORGE_DATABASE_SCHEMA:-forge}
      FORGE_BRIDGE_URL: ${FORGE_BRIDGE_URL:-}
      FORGE_BRIDGE_TOKEN: ${FORGE_BRIDGE_TOKEN:-}
      FORGE_AGENTIC_MODEL: ${FORGE_AGENTIC_MODEL:-openai-responses:gpt-6-luna}
      FORGE_AGENTIC_API_KEY: ${FORGE_AGENTIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - factory-data:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-initialize:
        condition: service_completed_successfully
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${FORGE_POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: forge
    volumes:
      - factory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  knowledge-bootstrap:
    build: .
    command: ["/app/.venv/bin/forge", "knowledge", "bootstrap", "--data-dir", "/data", "--service-dir", "/knowledge"]
    volumes:
      - factory-data:/data
      - knowledge-secrets:/knowledge
    restart: "no"
  knowledge-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canon
      POSTGRES_DB: flycanon
      POSTGRES_PASSWORD_FILE: /run/knowledge/postgres-password
    volumes:
      - knowledge-postgres:/var/lib/postgresql/data
      - knowledge-secrets:/run/knowledge:ro
    networks: [knowledge]
    depends_on:
      knowledge-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canon -d flycanon"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  embeddings:
    image: ollama/ollama:0.6.8
    volumes:
      - knowledge-models:/root/.ollama
    networks: [knowledge, model-download]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  embeddings-initialize:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_HOST: http://embeddings:11434
    command: ["pull", "nomic-embed-text"]
    networks: [knowledge]
    depends_on:
      embeddings:
        condition: service_healthy
    restart: "no"
  knowledge-migrate:
    build:
      context: .
      dockerfile: deploy/flycanon/Dockerfile
    command: ["migrate"]
    volumes:
      - knowledge-secrets:/run/knowledge:ro
    networks: [knowledge]
    depends_on:
      knowledge-postgres:
        condition: service_healthy
    restart: "no"
  knowledge:
    build:
      context: .
      dockerfile: deploy/flycanon/Dockerfile
    command: ["serve"]
    volumes:
      - knowledge-secrets:/run/knowledge:ro
      - knowledge-objects:/app/canon-data
    networks: [default, knowledge]
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully
      embeddings-initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://knowledge:8500/api/v1/version',context=ssl.create_default_context(cafile='/run/knowledge/ca.crt'),timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  knowledge-worker:
    build:
      context: .
      dockerfile: deploy/flycanon/Dockerfile
    command: ["worker"]
    volumes:
      - knowledge-secrets:/run/knowledge:ro
      - knowledge-objects:/app/canon-data
    networks: [knowledge]
    depends_on:
      knowledge:
        condition: service_healthy
    restart: unless-stopped
  knowledge-initialize:
    build: .
    command: ["/app/.venv/bin/forge", "knowledge", "initialize", "--data-dir", "/data"]
    volumes:
      - factory-data:/data
    depends_on:
      knowledge:
        condition: service_healthy
    restart: "no"
networks:
  knowledge:
    internal: true
  model-download:
volumes:
  knowledge-secrets:
  knowledge-postgres:
  knowledge-models:
  knowledge-objects:
  factory-data:
  factory-postgres:
