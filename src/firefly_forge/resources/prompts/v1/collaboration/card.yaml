name: collaboration/card
version: 1.0.0
description: Deterministic repository feedback card.
system_template: ''
user_template: |-
  ### forge · {{ title }}

  {{ description }}

  {{ sections }}

  <details>
  <summary>Run details</summary>

  Request: `{{ action }}`

  State: `{{ status }}`

  {{ details }}

  {{ run_reference }} Receipt: `{{ receipt_id }}`
  </details>
required_variables:
- title
- description
- sections
- action
- status
- details
- run_reference
- receipt_id
metadata:
  defaults: {}
