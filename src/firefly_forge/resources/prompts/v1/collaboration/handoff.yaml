name: collaboration/handoff
version: 1.0.0
description: Deterministic repository feedback handoff.
system_template: ''
user_template: |-
  {{ explanation }}

  {{ completed }} of {{ total }} checks completed; {{ failed }} failed.
required_variables:
- explanation
- completed
- total
- failed
metadata:
  defaults: {}
