  \ producción.\",\n    \"unknown\": \"desconocido\",\n    \"states\": {\n      \"\
  queued\": \"en cola\",\n      \"running\": \"en curso\",\n      \"developing\":\
  \ \"en desarrollo\",\n      \"validating\": \"en verificación\",\n      \"paused\"\
  : \"en pausa\",\n      \"needs_reconciliation\": \"pendiente de conciliación\",\n\
  \      \"succeeded\": \"finalizada con resultado aceptado por la fábrica\",\n  \
  \    \"failed\": \"detenida por un fallo\",\n      \"cancelled\": \"cancelada\"\
  ,\n      \"interrupted\": \"interrumpida\"\n    },\n    \"record\": \"Registro de\
  \ ejecución\"\n  }\n}"
