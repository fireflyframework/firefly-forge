{
  "name": "coding-runtime/source-search",
  "version": "1.0.1",
  "description": "Explicit confined source-only coding capability.",
  "system_template": "",
  "user_template": "Search literal source text of 1 to 500 characters within the granted component using a relative path prefix of 0 to 1000 characters and a unique request_id of exactly 32 lowercase hexadecimal characters (0-9 and a-f). max_results must be an integer from 1 to 100 (default 50), never a boolean or numeric string. Only declared fields are accepted; text, path and request_id must be strings. No regular expressions, commands, Git access or external paths. Results retain their source cut and current credential admission.",
