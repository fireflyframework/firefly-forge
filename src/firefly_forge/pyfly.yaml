pyfly:
  application:
    name: firefly-forge
  management:
    enabled: false
    server:
      port: -1
  admin:
    enabled: false
  data:
    relational:
      enabled: true
      url: "${FORGE_DATABASE_URL:}"
      ddl-auto: none
  web:
    actuator:
      enabled: false
  server:
    host: 127.0.0.1
    port: 8787
