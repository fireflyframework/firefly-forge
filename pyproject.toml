[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "firefly-forge"
version = "0.2.0"
description = "Firefly software factory: brief to verified product with interchangeable coding agents"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Firefly Software Foundation"}]
dependencies = [
  "pydantic>=2.13.3,<3",
  "httpx>=0.28.1,<1",
  "uvicorn>=0.41,<1",
  "click>=8.3,<9",
  "mcp>=2.3,<3",
  "filelock>=3.20,<5",
  "pyfly[data-relational,postgresql,web] @ https://github.com/fireflyframework/fireflyframework-pyfly/releases/download/v26.10.01/pyfly-26.10.1-py3-none-any.whl",
  "fireflyframework-agentic @ https://github.com/fireflyframework/fireflyframework-agentic/releases/download/v26.09.0/fireflyframework_agentic-26.9.0-py3-none-any.whl",
  "flycanon-sdk @ https://github.com/firefly-operationOS/flycanon/releases/download/v26.9.0/flycanon_sdk-26.9.0-py3-none-any.whl",
]

[project.scripts]
forge = "firefly_forge.cli:main"

[project.urls]
Repository = "https://github.com/fireflyframework/firefly-forge"
Documentation = "https://fireflyframework.github.io/firefly-forge/"
Issues = "https://github.com/fireflyframework/firefly-forge/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "mypy>=1.20,<2", "build>=1.4,<2"]
docs = ["mkdocs==1.6.1", "mkdocs-material>=9.7,<10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/firefly_forge"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.hatch.build.targets.sdist.force-include]
"studio/dist" = "studio/dist"

[tool.hatch.build]
exclude = ["**/node_modules/**", "**/.venv/**", "**/__pycache__/**", "**/.codex/**", "**/AGENTS.md", "**/CLAUDE.md", "**/.env", "**/test-results/**", "**/playwright-report/**", "**/.forge/**", "/dist/**", "/build/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = ["live: opt-in real local subscription execution"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/firefly_forge"]
